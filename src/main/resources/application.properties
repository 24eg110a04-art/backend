spring.application.name=expense-tracker
server.port=8080

# ---- MySQL (credentials come from environment variables) ----
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate (tables are created/updated automatically in development) ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
# Set JWT_SECRET to a long random string (at least 32 characters) for anything beyond local development.
app.jwt.secret=${JWT_SECRET:expense-tracker-dev-secret-change-me-0123456789abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# We use JWT only, so skip Spring Boot's generated default user/password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
